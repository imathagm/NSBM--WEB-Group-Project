<!DOCTYPE html>
<html lang="en" data-css-page="account-recovery">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | NSBM Sports Hub</title>

    <link rel="stylesheet" href="../app.css">


</head>

<body>

    <main class="recovery-wrap">

        <section class="recovery-card">

            <h1>Forgot Password?</h1>

            <p>
                Enter your registered email address.
                We will send you a password reset link
                if an account matches.
            </p>

            <form id="forgotForm">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <button type="submit" id="submitButton">
                    Send Reset Link
                </button>

            </form>

            <p id="message" role="status" aria-live="polite"></p>

            <a href="./login.html">
                Back to Login
            </a>

        </section>

    </main>

    <script>
        const form = document.getElementById("forgotForm");
        const message = document.getElementById("message");
        const button = document.getElementById("submitButton");

        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            button.disabled = true;
            button.textContent = "Sending...";
            message.textContent = "";

            try {

                const response = await fetch(
                    "../../backend/api/forgot-password.php",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: document
                                .getElementById("email")
                                .value
                                .trim()
                        })
                    }
                );

                const data = await response.json();

                message.textContent = data.message;

            } catch (error) {

                message.textContent =
                    "Unable to connect to the server. Please try again.";

            } finally {

                button.disabled = false;
                button.textContent = "Send Reset Link";

            }

        });
    </script>
    <script>
    if (localStorage.getItem("nsbm-theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
    }
</script>

</body>
</html>
