<!DOCTYPE html>
<html lang="en" data-css-page="account-recovery">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | NSBM Sports Hub</title>

    <link rel="stylesheet" href="../app.css">


</head>

<body>

    <main class="recovery-wrap">

        <section class="recovery-card">

            <h1>Reset Password</h1>

            <p>Enter your new password below.</p>

            <form id="resetForm">

                <label for="password">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="128"
                    required
                >

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="128"
                    required
                >

                <button type="submit" id="submitButton">
                    Reset Password
                </button>

            </form>

            <p id="message" role="status" aria-live="polite"></p>

            <a href="./login.html">
                Back to Login
            </a>

        </section>

    </main>

    <script>
        const form = document.getElementById("resetForm");
        const message = document.getElementById("message");
        const button = document.getElementById("submitButton");

        const token = new URLSearchParams(
            window.location.search
        ).get("token");

        if (!token) {
            form.hidden = true;

            message.textContent =
                "Invalid reset link. Please request a new link.";
        }

        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {

                message.textContent =
                    "Passwords do not match.";

                return;
            }

            button.disabled = true;
            button.textContent = "Updating...";

            try {

                const response = await fetch(
                    "../../backend/api/reset-password.php",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            token: token,
                            password: password
                        })
                    }
                );

                const data = await response.json();
                message.style.color = response.ok ? "" : "#b42318";
                message.textContent = data.message || "Password reset failed.";

                if (response.ok && data.success) {
                    form.hidden = true;
                }

            } catch (error) {

                message.style.color = "#b42318";
                message.textContent =
                    "Unable to connect to the server.";

            } finally {

                button.disabled = false;
                button.textContent = "Reset Password";

            }

        });
    </script>
    <script>
    if (localStorage.getItem("nsbm-theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
    }
</script>

</body>
</html>
