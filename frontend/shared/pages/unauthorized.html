
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access Denied | NSBM SportsHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .error-container {
            text-align: center;
            background: #ffffff;
            padding: 50px 30px;
            border-radius: 15px;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .error-code {
            font-size: 90px;
            font-weight: bold;
            color: #1d5c3a;
        }

        h1 {
            color: #1d5c3a;
            margin: 15px 0;
        }

        p {
            color: #666;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-primary {
            background: #1d5c3a;
            color: white;
        }

        .btn-primary:hover {
            background: #144329;
        }

        .btn-secondary {
            border: 1px solid #1d5c3a;
            color: #1d5c3a;
        }

        .btn-secondary:hover {
            background: #e8f2ec;
        }
    </style>
</head>

<body>

    <div class="error-container">

        <div class="error-code">403</div>

        <h1>Access Denied</h1>

        <p>
            Sorry! You don't have permission to access this resource.
            Please contact the administrator if you believe this is a mistake.
        </p>

        <div class="buttons">

            <a href="javascript:history.back()" class="btn btn-secondary">
                Go Back
            </a>

            <a href="../../index.html" class="btn btn-primary">
                Return Home
            </a>

        </div>

    </div>

</body>
</html>
