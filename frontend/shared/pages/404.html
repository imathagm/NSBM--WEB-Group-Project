
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 Not Found | NSBM SportsHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .error-container {
            text-align: center;
            background: #ffffff;
            padding: 50px 30px;
            border-radius: 15px;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .error-code {
            font-size: 100px;
            font-weight: bold;
            color: #1d5c3a;
        }

        h1 {
            color: #1d5c3a;
            margin: 15px 0;
        }

        p {
            color: #666;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 6px;
            background: #1d5c3a;
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #144329;
        }
    </style>
</head>

<body>

    <div class="error-container">

        <div class="error-code">404</div>

        <h1>Page Not Found</h1>

        <p>
            Oops! The page you are looking for could not be found.
            It may have been moved, deleted, or the URL may be incorrect.
        </p>

        <a href="../../index.html" class="btn">
            Return Home
        </a>

    </div>

</body>
</html>
